<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <radialGradient id="favCanvas" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4E1546" />
      <stop offset="45%" stop-color="#2A0B26" />
      <stop offset="85%" stop-color="#150214" />
      <stop offset="100%" stop-color="#0B010A" />
    </radialGradient>
    <linearGradient id="favGold" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFEE8" />
      <stop offset="25%" stop-color="#F5BE2E" />
      <stop offset="60%" stop-color="#EAAA00" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>

  <!-- Outer Base Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#favCanvas)" stroke="url(#favGold)" stroke-width="3" />
  
  <!-- Guilloché Precision Ring -->
  <circle cx="50" cy="50" r="43.5" stroke="url(#favGold)" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.8" />

  <!-- Tri-Star Summit -->
  <polygon points="50,13 51.5,17 55.5,17 52.3,19.5 53.5,23.5 50,21 46.5,23.5 47.7,19.5 44.5,17 48.5,17" fill="url(#favGold)" />
  <polygon points="37,17 38.2,20 41.5,20 38.8,22 39.8,25 37,23 34.2,25 35.2,22 32.5,20 35.8,20" fill="url(#favGold)" transform="scale(0.85) translate(8, 2.5)" />
  <polygon points="63,17 64.2,20 67.5,20 64.8,22 65.8,25 63,23 60.2,25 61.2,22 58.5,20 61.8,20" fill="url(#favGold)" transform="scale(0.85) translate(8, 2.5)" />

