  <path d="M50 25 C47.5 28.5 45.5 31.5 47 34.5 C48 36.5 50.5 37 50 39 C49.5 37 52 36.5 53 34.5 C54.5 31.5 52.5 28.5 50 25 Z" fill="url(#favGold)" />

  <!-- Bold PCA Monogram -->
  <text x="50" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1.5px" fill="url(#favGold)">PCA</text>

  <!-- MKCL ALC Plaque -->
  <rect x="23" y="61" width="54" height="11.5" rx="3" fill="#230620" stroke="url(#favGold)" stroke-width="1" />
  <text x="50" y="69.5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="7" letter-spacing="1.8px" fill="#FFFEE8">MKCL ALC</text>

  <!-- Academic Laurel Wreath Arc -->
  <path d="M22 69 C20 73 23 77 27 80 C28 78 28 75 25 72 Z" fill="url(#favGold)" />
  <path d="M28 79 C31 83 35 85 40 86 C40 84 39 81 35 79 Z" fill="url(#favGold)" />
  <path d="M78 69 C80 73 77 77 73 80 C72 78 72 75 75 72 Z" fill="url(#favGold)" />
  <path d="M72 79 C69 83 65 85 60 86 C60 84 61 81 65 79 Z" fill="url(#favGold)" />
  <circle cx="50" cy="86" r="1.8" fill="#FFFEE8" />
